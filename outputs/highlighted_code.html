<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Highlighted Code</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
            margin: 0;
        }
        pre {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            overflow: auto;
            font-size: 14px;
            line-height: 1.6;
            tab-size: 4;
            white-space: pre-wrap;
        }
        
            .kw { color: #0000FF; font-weight: bold; }
            .type { color: #00FF00; }
            .class { color: #00FF00; font-weight: bold; }
            .func { color: #FFD700; }
            .ident { color: #FFFFFF; }
            .num { color: #FFA500; }
            .str { color: #32CD32; }
            .char { color: #32CD32; }
            .op { color: #D3D3D3; }
            .comment { color: #808080; font-style: italic; }
            .preproc { color: #FF00FF; }
            .error { color: #FF0000; text-decoration: underline; }
        
    </style>
</head>
<body>
    <pre><span class="type">int</span> <span class="func">add</span> (<span class="type">int</span> <span class="ident">a</span>,<span class="type">int</span> <span class="ident">b</span>){
    <span class="kw">return</span> <span class="ident">a</span> <span class="op">+</span> <span class="ident">b</span>;
}

<span class="type">float</span> <span class="func">main</span> () {
    <span class="type">int</span> <span class="ident">amir</span> <span class="op">=</span> <span class="num">1</span>;
    <span class="type">int</span> <span class="ident">bagher</span> <span class="op">=</span> <span class="num">2</span>;
    <span class="type">int</span> <span class="ident">c</span> <span class="op">=</span> <span class="func">add</span>(<span class="ident">amir</span>, <span class="ident">bagher</span>);
    <span class="kw">for</span>(<span class="error">)</span>;
}</pre>
</body>
</html>
